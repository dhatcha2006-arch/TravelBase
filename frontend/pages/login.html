<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In | TravelBase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script defer src="../assets/js/main.js"></script>
    <script defer src="../assets/js/auth.js"></script>
  </head>
  <body data-root="..">
    <main class="auth-page">
      <section class="auth-image">
        <div class="auth-image-copy">
          <a class="brand" href="../index.html">Travel<span>Base</span></a>
          <h2>Your next chapter starts somewhere new.</h2>
          <p>Sign in to keep your travel plans close and your journey moving.</p>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-box">
          <a class="brand" href="../index.html"><span class="brand-mark"><i class="bi bi-compass"></i></span>Travel<span>Base</span></a>
          <h1>Welcome back</h1>
          <p>Sign in to your TravelBase account.</p>
          <div id="form-message" hidden>
          </div>
          <form class="auth-form" id="login-form" novalidate>
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" required autocomplete="username">
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required autocomplete="current-password">
            </div>
            <div class="check-row">
              <label><input type="checkbox" name="remember"> Remember me</label>
              <a href="#" id="forgot-password">Forgot password?</a>
            </div>
            <button class="btn btn-primary" type="submit">Log in</button>
          </form>
          <p style="margin-top:22px">New to TravelBase? <a href="register.html">Create an account</a></p>
          <p class="notice">Customers and administrators use this shared sign-in page.</p>
        </div>
      </section>
    </main>
  </body>
</html>
