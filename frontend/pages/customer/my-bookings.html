<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bookings | TravelBase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <script defer src="../../assets/js/main.js"></script>
    <script defer src="../../assets/js/admin.js"></script>
    <script defer src="../../assets/js/booking.js"></script>
  </head>
  <body data-root="../.." data-role="customer" data-section="bookings">
    <div id="dashboard-shell">
    </div>
    <main class="app-main">
      <div class="app-titlebar">
        <div>
          <h1>My bookings</h1>
          <p>Review your trip details and booking status.</p>
        </div>
        <a class="btn btn-primary" href="../../pages/packages.html">Find another trip</a>
      </div>
      <section class="panel">
        <div class="toolbar">
          <input class="control" id="my-booking-search" type="search" placeholder="Search trips" aria-label="Search bookings">
        </div>
        <div class="table-wrap">
          <table id="my-bookings-table">
            <thead>
              <tr>
                <th>Booking ID</th>
                <th>Package</th>
                <th>Travel date</th>
                <th>Guests</th>
                <th>Total</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>TE-24081</td>
                <td>Bali Island Escape</td>
                <td>12 May 2027</td>
                <td>2</td>
                <td>₹2,58,000</td>
                <td><span class="badge badge-success">Confirmed</span></td>
                <td><button class="btn btn-outline btn-sm" data-cancel-booking>Cancel</button></td>
              </tr>
              <tr>
                <td>TE-23109</td>
                <td>Kyoto Culture Trail</td>
                <td>03 Oct 2025</td>
                <td>2</td>
                <td>₹3,48,000</td>
                <td><span class="badge">Completed</span></td>
                <td><a class="btn btn-outline btn-sm" href="../../pages/package-details.html?id=kyoto-culture">View trip</a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
