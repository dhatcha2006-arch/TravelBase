<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | TravelBase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script defer src="../assets/js/main.js"></script>
    <script defer src="../assets/js/auth.js"></script>
  </head>
  <body data-root="..">
    <main class="auth-page">
      <section class="auth-image">
        <div class="auth-image-copy">
          <a class="brand" href="../index.html">Travel<span>Base</span></a>
          <h2>Make room for the journey.</h2>
          <p>Set up your account to save the details and make planning your next trip a little easier.</p>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-box">
          <a class="brand" href="../index.html"><span class="brand-mark"><i class="bi bi-compass"></i></span>Travel<span>Base</span></a>
          <h1>Create your account</h1>
          <p>A few details to get started.</p>
          <div id="form-message" hidden>
          </div>
          <form class="auth-form" id="register-form" novalidate>
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" name="name" required autocomplete="name">
            </div>
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" required autocomplete="email">
            </div>
            <div class="field">
              <label for="phone">Phone number</label>
              <input id="phone" name="phone" type="tel" required autocomplete="tel">
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
            </div>
            <div class="field">
              <label for="confirm-password">Confirm password</label>
              <input id="confirm-password" name="confirmPassword" type="password" required autocomplete="new-password">
            </div>
            <button class="btn btn-primary" type="submit">Create account</button>
          </form>
          <p style="margin-top:20px">Already registered? <a href="login.html">Log in</a></p>
          <p class="notice">Demo only: account creation is not connected to a server.</p>
        </div>
      </section>
    </main>
  </body>
</html>
