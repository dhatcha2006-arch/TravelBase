<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Destinations | TravelBase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <script defer src="../../assets/js/main.js"></script>
    <script defer src="../../assets/js/admin.js"></script>
  </head>
  <body data-root="../.." data-role="admin" data-section="destinations">
    <div id="dashboard-shell">
    </div>
    <main class="app-main">
      <div class="app-titlebar">
        <div>
          <h1>Destinations</h1>
          <p>Manage the places represented in TravelBase packages.</p>
        </div>
        <button id="add-destination" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add destination</button>
      </div>
      <section class="panel">
        <div class="toolbar">
          <input id="table-search" class="control admin-search" type="search" placeholder="Search destinations" aria-label="Search destinations">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Destination</th>
                <th>Country / location</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="destination-rows">
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
