<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Packages | TravelBase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <script defer src="../../assets/js/main.js"></script>
    <script defer src="../../assets/js/admin.js"></script>
  </head>
  <body data-root="../.." data-role="admin" data-section="packages">
    <div id="dashboard-shell">
    </div>
    <main class="app-main">
      <div class="app-titlebar">
        <div>
          <h1>Tour packages</h1>
          <p>Create and maintain the trips shown on the public website.</p>
        </div>
        <button id="add-package" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add package</button>
      </div>
      <section class="panel">
        <div class="toolbar">
          <input id="table-search" class="control admin-search" type="search" placeholder="Search packages" aria-label="Search packages">
          <span class="notice">Demo changes are held in memory and aren't sent to a server.</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Package</th>
                <th>Destination</th>
                <th>Price / person</th>
                <th>Duration</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-package-rows">
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
