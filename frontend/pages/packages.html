<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tour Packages | TravelBase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script defer src="../assets/js/main.js"></script>
    <script defer src="../assets/js/packages.js"></script>
  </head>
  <body data-root="..">
    <header id="site-header">
    </header>
    <main>
      <section class="page-hero">
        <div class="container page-title">
          <div class="breadcrumb">
            <a href="../index.html">Home</a>
            / Tour packages
          </div>
          <span class="eyebrow">Find your kind of somewhere</span>
          <h1>Journeys with a little more meaning</h1>
          <p>Explore handpicked trips shaped by local insight, thoughtful pacing and the freedom to travel your way.</p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="toolbar">
            <div id="result-count" class="text-muted">
            </div>
            <p class="notice">Prices shown per person, based on double occupancy.</p>
          </div>
          <div class="filter-bar">
            <input id="package-search" class="control" type="search" placeholder="Search destination or package" aria-label="Search packages">
            <select id="price-filter" class="control" aria-label="Filter by maximum price"><option value="">Any price</option><option value="150000">Up to ₹1,50,000</option><option value="200000">Up to ₹2,00,000</option><option value="250000">Up to ₹2,50,000</option></select>
            <select id="duration-filter" class="control" aria-label="Filter by maximum duration"><option value="">Any duration</option><option value="5">5 days or less</option><option value="7">7 days or less</option><option value="9">9 days or less</option></select>
            <select id="sort-filter" class="control" aria-label="Sort packages"><option value="">Recommended</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
          </div>
          <div class="package-grid" id="package-list">
          </div>
        </div>
      </section>
    </main>
    <footer id="site-footer" class="site-footer">
    </footer>
  </body>
</html>
